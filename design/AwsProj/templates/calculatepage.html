<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metoda - Расчет веществ</title>
    <link rel="stylesheet" href="/static/styles/calculatepage_style.css">
</head>
<body>
    <header>
        <a href="/chemistry" class="home-link">
            <img src="http://localhost:9000/staticimages/image.svg" alt="На главную">
        </a>

        <div class="header-result">
            <input type="text" placeholder="Результат" readonly>
        </div>
    </header>

    <!-- Поле для ввода температуры со счетчиком элементов -->
    <div class="temperature-section">
        <div class="counter-container">
            <div class="counter">Элементов: <span id="itemsCount">0</span></div>
        </div>
        
        <form class="temperature-form">
            <div class="input-group">
                <label for="temperature">Температура (°C):</label>
                <input type="number" id="temperature" placeholder="25" step="0.1" min="-273" max="1000" value="25">
                <button type="button" class="btn-temperature">Применить</button>
            </div>
        </form>
    </div>

    <main>
        <div class="cards-container">
            {{ range .data }}
            <div class="card">
                <img src="{{ .Image }}" alt="{{ .Title }}" class="card-img">
                <h3>{{ .Title }}</h3>
                <p><strong>pH:</strong> {{ .PH }} при {{ .Concentration }} 25°C</p>
                
                <div class="mass-input">
                    <label for="mass-{{ .ID }}">Масса (г):</label>
                    <input type="number" id="mass-{{ .ID }}" class="mass-field" placeholder="0.0" step="0.1" min="0">
                </div>

                <button class="btn calculate-btn" data-id="{{ .ID }}">
                    Сформировать заявку
                </button>
            </div>
            {{ end }}
        </div>
    </main>
</body>
</html>
