<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metoda - Расчет веществ</title>
    <link rel="stylesheet" href="/static/styles/calculatepage_style.css">
</head>
<body>
    <header>
        <a href="/chemistry" class="home-link">
            <img src="http://localhost:9000/staticimages/image.svg" alt="На главную">
        </a>

        <div class="header-result">
            <input type="text" 
                   placeholder="Результат" 
                   readonly
                   value="{{if .showResult}}pH: {{.calculatedPH}} с добавленной водой{{end}}"
                   id="resultField">
        </div>
    </header>

    <!-- Поле для ввода добавленной воды со счетчиком элементов и кнопкой заявки -->
    <div class="temperature-section">
        <div class="counter-container">
            <div class="counter">Элементов: <span id="itemsCount">{{len .data}}</span></div>
        </div>
        
        <form class="temperature-form" id="temperatureForm">
            <div class="input-group">
                <label for="added_water">Добавленная вода (мл):</label>
                <input type="number" id="added_water" name="added_water" placeholder="100" step="1" min="0" value="{{if .added_water}}{{.added_water}}{{else}}100{{end}}">
                <button type="button" class="btn-temperature">Применить</button>
            </div>
        </form>

        <!-- Кнопка формирования заявки -->
        <div class="request-section">
            <form method="POST" action="/create-request" id="requestForm">
                <input type="hidden" name="added_water" id="hiddenAddedWater" value="{{if .added_water}}{{.added_water}}{{else}}100{{end}}">
                <button type="submit" class="btn calculate-btn" id="createRequestBtn" {{if not .data}}disabled{{end}}>
                    Сформировать заявку
                </button>
            </form>
        </div>
    </div>

    <main>
        <div class="cards-container">
            {{ range .data }}
            <div class="card">
                <img src="{{ .Image }}" alt="{{ .Title }}" class="card-img">
                <h3>{{ .Title }}</h3>
                <p><strong>pH:</strong> {{ .PH }} при {{ .Concentration }} 25°C</p>
                
                <div class="mass-input">
                    <label for="mass-{{ .ID }}">Объем (мл):</label>
                    <input type="number" id="mass-{{ .ID }}" class="mass-field" placeholder="{{ .Volume }}" step="0.1" min="0" value="{{ .Volume }}">
                </div>

                <!-- Кнопка удаления из корзины -->
                <form method="POST" action="/remove-from-cart" class="remove-form">
                    <input type="hidden" name="element_id" value="{{ .ID }}">
                    <button type="submit" class="btn btn-remove">Удалить</button>
                </form>
            </div>
            {{ else }}
            <div class="empty-cart">
                <p>Корзина пуста</p>
                <a href="/chemistry" class="btn">Добавить элементы</a>
            </div>
            {{ end }}
        </div>
    </main>

    <script>
        // Обновляем скрытое поле добавленной воды при изменении основной
        document.getElementById('added_water').addEventListener('input', function() {
            document.getElementById('hiddenAddedWater').value = this.value;
            document.getElementById('resultField').value = '';
        });
        
        // Обновляем кнопку применения добавленной воды
        document.querySelector('.btn-temperature').addEventListener('click', function() {
            const addedWater = document.getElementById('added_water').value;
            document.getElementById('resultField').value = '';
            alert('Добавленная вода применена: ' + addedWater + ' мл');
        });

        // Показываем анимацию при отправке формы заявки
        document.getElementById('requestForm').addEventListener('submit', function() {
            const btn = document.getElementById('createRequestBtn');
            btn.disabled = true;
            btn.textContent = 'Расчет...';
        });

        // Подтверждение удаления
        document.querySelectorAll('.remove-form').forEach(form => {
            form.addEventListener('submit', function(e) {
                if (!confirm('Удалить этот элемент из корзины?')) {
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
