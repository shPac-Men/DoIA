<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metoda - Расчет веществ</title>
    <link rel="stylesheet" href="/static/styles/calculatepage_style.css">
</head>
<body>
    <header>
        <a href="/chemistry" class="home-link">
            <img src="http://localhost:9000/staticimages/image.svg" alt="На главную">
        </a>

        <div class="header-result">
            <input type="text" placeholder="Результат" readonly>
        </div>
    </header>

    <!-- Поле для ввода температуры со счетчиком элементов и кнопкой заявки -->
    <div class="temperature-section">
        <div class="counter-container">
            <div class="counter">Элементов: <span id="itemsCount">{{len .data}}</span></div>
        </div>
        
        <form class="temperature-form" id="temperatureForm">
            <div class="input-group">
                <label for="temperature">Температура (°C):</label>
                <input type="number" id="temperature" name="temperature" placeholder="25" step="0.1" min="-273" max="1000" value="25">
                <button type="button" class="btn-temperature">Применить</button>
            </div>
        </form>

        <!-- Кнопка формирования заявки -->
        <div class="request-section">
            <form method="POST" action="/create-request" id="requestForm">
                <input type="hidden" name="temperature" id="hiddenTemperature" value="25">
                <button type="submit" class="btn calculate-btn" id="createRequestBtn" {{if not .data}}disabled{{end}}>
                    Сформировать заявку
                </button>
            </form>
        </div>
    </div>

    <main>
        <div class="cards-container">
            {{ range .data }}
            <div class="card">
                <img src="{{ .Image }}" alt="{{ .Title }}" class="card-img">
                <h3>{{ .Title }}</h3>
                <p><strong>pH:</strong> {{ .PH }} при {{ .Concentration }} 25°C</p>
                
                <div class="mass-input">
                    <label for="mass-{{ .ID }}">Объем (мл):</label>
                    <input type="number" id="mass-{{ .ID }}" class="mass-field" placeholder="{{ .Volume }}" step="0.1" min="0" value="{{ .Volume }}">
                </div>
            </div>
            {{ else }}
            <div class="empty-cart">
                <p>Корзина пуста</p>
                <a href="/chemistry" class="btn">Добавить элементы</a>
            </div>
            {{ end }}
        </div>
    </main>

    <script>
        // Обновляем скрытое поле температуры при изменении основной температуры
        document.getElementById('temperature').addEventListener('input', function() {
            document.getElementById('hiddenTemperature').value = this.value;
        });
        
        // Обновляем кнопку применения температуры
        document.querySelector('.btn-temperature').addEventListener('click', function() {
            const temperature = document.getElementById('temperature').value;
            alert('Температура применена: ' + temperature + '°C');
            // Здесь можно добавить логику применения температуры
        });
    </script>
</body>
</html>
