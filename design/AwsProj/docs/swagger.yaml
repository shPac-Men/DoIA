      - description: Element to remove
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.DeleteFromMixedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Element removed successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request or ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden - Admin access required
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Order or element not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete element from order
      tags:
      - admin
  /admin/users:
    get:
      consumes:
      - application/json
      description: Get list of all users in system (Admin only)
      produces:
