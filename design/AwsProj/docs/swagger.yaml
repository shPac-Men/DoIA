    put:
      consumes:
      - application/json
      description: Update an existing chemical element (Admin only)
      parameters:
      - description: Element ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated element data
        in: body
        name: request
        required: true
        schema:
