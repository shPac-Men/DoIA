basePath: /api/v1
definitions:
  handler.AddToMixingRequest:
    properties:
      element_id:
        type: integer
      volume:
        minimum: 0
        type: number
    required:
    - element_id
    - volume
    type: object
  handler.CartIconResponse:
    properties:
      draft_order_id:
        type: integer
      items_count:
        type: integer
    type: object
  handler.CreateElementRequest:
    properties:
      concentration:
        minimum: 0
        type: number
      description:
        maxLength: 100
        type: string
      name:
        maxLength: 25
        minLength: 1
        type: string
      ph:
        maximum: 14
        minimum: 0
        type: number
    required:
    - concentration
    - name
    - ph
    type: object
  handler.CreateMixingRequest:
    properties:
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  handler.LoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  handler.LoginResponse:
    properties:
      expires_in:
        type: integer
      token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/handler.UserInfo'
    type: object
  handler.RegisterRequest:
    properties:
      login:
        maxLength: 25
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
    required:
    - login
    - password
    type: object
  handler.RegisterResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/handler.UserInfo'
    type: object
  handler.RemoveFromMixingRequest:
    properties:
      element_id:
        type: integer
    required:
    - element_id
    type: object
  handler.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  handler.UpdateElementRequest:
    properties:
      concentration:
        minimum: 0
        type: number
      description:
        maxLength: 100
        type: string
      name:
        maxLength: 25
        minLength: 1
        type: string
      ph:
        maximum: 14
        minimum: 0
        type: number
    type: object
  handler.UpdateMixedRequest:
    properties:
      added_water:
        type: number
      concentration:
        type: number
      ph:
        type: number
      status:
        type: string
      total_volume:
        type: number
    type: object
  handler.UpdateUserRequest:
    properties:
      login:
        maxLength: 25
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
    type: object
  handler.UpdateUserRoleRequest:
    properties:
      is_moderator:
        type: boolean
    type: object
  handler.UserInfo:
    properties:
      id:
        type: integer
      is_moderator:
        type: boolean
      login:
        type: string
      role:
        type: string
    type: object
  service.CompleteMixedRequest:
    type: object
  service.DeleteFromMixedRequest:
    properties:
      elementID:
        type: integer
      hardDelete:
        type: boolean
    type: object
  service.DeleteMixedRequest:
    properties:
      hardDelete:
        type: boolean
    type: object
host: localhost:8082
info:
  contact:
    email: bitop@spatecon.ru
    name: API Support
    url: https://vk.com/bmstu_schedule
  description: DoIA
  license:
    name: AS IS (NO WARRANTY)
  title: API Chemistry
  version: "1.0"
paths:
  /admin/mixed:
    get:
      consumes:
      - application/json
      description: Get list of all mixing orders in system (Admin only)
      parameters:
      - description: Filter by status (draft, pending, completed)
        in: query
        name: status
        type: string
      - description: Filter by creator login
        in: query
        name: creator
        type: string
      - description: 'Limit results (default: 50)'
        in: query
        name: limit
        type: integer
      - description: 'Offset results (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: All orders retrieved
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden - Admin access required
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all mixing orders
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Create a new mixing order from user's cart (Admin only)
      parameters:
      - description: Mixing order data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateMixingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Mixing order created successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request or empty cart
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden - Admin access required
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create mixing order from cart
      tags:
      - mixing
  /admin/mixed/{id}:
    delete:
      consumes:
      - application/json
      description: Soft or hard delete mixing order (Admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'Delete options (hard_delete: true for permanent delete)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.DeleteMixedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Order deleted successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request or ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden - Admin access required
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete mixing order
      tags:
      - admin
    get:
      consumes:
      - application/json
      description: Get detailed info about any mixing order (Admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order retrieved
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid ID format
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden - Admin access required
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get mixing order by ID
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Update mixing order parameters (Admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated order data (all fields optional)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateMixedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Order updated successfully
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid request or ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden - Admin access required
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update mixing order
      tags:
      - admin
  /admin/mixed/{id}/complete:
    put:
      consumes:
      - application/json
      description: Mark mixing order as completed (Admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
