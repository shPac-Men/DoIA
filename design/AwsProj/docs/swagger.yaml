      produces:
      - application/json
      responses:
        "200":
          description: User retrieved
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Invalid user ID format
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
