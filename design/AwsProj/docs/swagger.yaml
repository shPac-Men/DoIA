  /elements:
    get:
      consumes:
      - application/json
      description: Get list of all elements with optional search by name
      parameters:
      - description: Search query by element name
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success response with elements list
          schema:
            additionalProperties: true
            type: object
        "500":
