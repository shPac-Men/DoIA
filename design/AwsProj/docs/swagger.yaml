basePath: /api/v1
definitions:
  handler.AddToMixingRequest:
    properties:
      element_id:
        type: integer
      volume:
        minimum: 0
        type: number
    required:
    - element_id
    - volume
    type: object
  handler.CartIconResponse:
    properties:
      draft_order_id:
        type: integer
      items_count:
        type: integer
    type: object
  handler.CreateElementRequest:
    properties:
      concentration:
        minimum: 0
        type: number
      description:
        maxLength: 100
        type: string
      name:
        maxLength: 25
        minLength: 1
        type: string
      ph:
        maximum: 14
        minimum: 0
        type: number
    required:
    - concentration
    - name
    - ph
    type: object
  handler.CreateMixingRequest:
    properties:
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  handler.ElementResponse:
    properties:
      concentration:
        type: number
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      ph:
        type: number
    type: object
  handler.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  handler.LoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  handler.LoginResponse:
    properties:
      expires_in:
        type: integer
      token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/handler.UserInfo'
    type: object
  handler.MixedDetailItem:
    properties:
      comment:
        type: string
      concentration:
        type: number
      element_id:
        type: integer
      image:
        type: string
      ph:
        type: number
      title:
        type: string
      volume:
        type: number
    type: object
  handler.MixedDetailResponse:
    properties:
      added_water:
        type: number
      concentration:
        type: number
      creator_login:
        type: string
      date_create:
        type: string
      date_finish:
        type: string
      date_update:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/handler.MixedDetailItem'
        type: array
      items_count:
        description: <--- Добавляем с JSON тегом
        type: integer
      moderator_login:
        type: string
      ph:
        type: number
      status:
        type: string
      total_volume:
        type: number
    type: object
  handler.MixedListItem:
    properties:
      added_water:
        type: number
      concentration:
        type: number
      creator_login:
        type: string
      date_create:
        type: string
      date_finish:
        type: string
      date_update:
        type: string
      id:
        type: integer
      items_count:
        description: <--- Добавляем
        type: integer
      moderator_login:
        type: string
      ph:
        type: number
      status:
        type: string
      total_volume:
        type: number
    type: object
  handler.MixingItemResponse:
    properties:
      concentration:
        type: number
      id:
        type: integer
      image:
        type: string
      ph:
        type: number
      title:
        type: string
      volume:
        type: number
    type: object
  handler.MixingResponse:
    properties:
      cart_id:
        type: integer
      items:
        items:
          $ref: '#/definitions/handler.MixingItemResponse'
        type: array
      total_items:
        type: integer
      user_id:
        type: integer
    type: object
  handler.RegisterRequest:
    properties:
      login:
        maxLength: 25
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
    required:
    - login
    - password
    type: object
  handler.RemoveFromMixingRequest:
    properties:
      element_id:
        type: integer
    required:
    - element_id
    type: object
  handler.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  handler.UpdateElementRequest:
    properties:
      concentration:
        minimum: 0
        type: number
      description:
        maxLength: 100
        type: string
      name:
        maxLength: 25
        minLength: 1
        type: string
      ph:
        maximum: 14
        minimum: 0
        type: number
    type: object
  handler.UpdateMixedRequest:
    properties:
      added_water:
        type: number
      concentration:
        type: number
      ph:
        type: number
      status:
        type: string
      total_volume:
        type: number
    type: object
  handler.UpdateUserRequest:
    properties:
      login:
        maxLength: 25
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
    type: object
  handler.UpdateUserRoleRequest:
    properties:
      is_moderator:
        type: boolean
    type: object
  handler.UserInfo:
    properties:
      id:
        type: integer
      is_moderator:
        type: boolean
      login:
        type: string
      role:
        type: string
    type: object
  handler.UserProfileResponse:
    properties:
      id:
        type: integer
      is_moderator:
        type: boolean
      login:
        type: string
      role:
        type: string
    type: object
  service.AddToMixingResponse:
    properties:
      elementID:
        type: integer
      message:
        type: string
      userID:
        type: integer
      volume:
        format: float32
        type: number
    type: object
  service.CompleteMixedRequest:
    type: object
  service.CompleteMixedResponse:
    properties:
      dateUpdate:
        type: string
      message:
        type: string
      mixedID:
        type: integer
      status:
        type: string
    type: object
  service.CreateElementResponse:
    properties:
      concentration:
        format: float32
        type: number
      description:
        type: string
      id:
        type: integer
      message:
        type: string
      name:
        type: string
      ph:
        format: float32
        type: number
    type: object
  service.DeleteElementResponse:
    properties:
      id:
        type: integer
      message:
        type: string
    type: object
  service.DeleteFromMixedRequest:
    properties:
      elementID:
        type: integer
      hardDelete:
        type: boolean
    type: object
  service.DeleteMixedRequest:
    properties:
      hardDelete:
        type: boolean
    type: object
  service.ElementResponse:
    properties:
      concentration:
        format: float32
        type: number
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      message:
        type: string
      name:
        type: string
      ph:
        format: float32
        type: number
    type: object
  service.UploadImageResponse:
    properties:
      id:
        type: integer
      image:
        type: string
      message:
        type: string
    type: object
host: localhost:8082
info:
  contact:
    email: bitop@spatecon.ru
    name: API Support
    url: https://vk.com/bmstu_schedule
  description: DoIA
  license:
    name: AS IS (NO WARRANTY)
  title: API Chemistry
  version: "1.0"
paths:
  /admin/mixed:
    get:
      consumes:
      - application/json
      description: Get list of all mixing orders in system (Admin only)
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by creator login
        in: query
        name: creator
        type: string
      - description: 'Limit results (default: 50)'
        in: query
        name: limit
        type: integer
      - description: 'Offset results (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.MixedListItem'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all mixing orders
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Create a new mixing order from user's cart (Admin only)
      parameters:
      - description: Mixing order data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateMixingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create mixing order from cart
      tags:
      - mixing
  /admin/mixed/{id}:
    delete:
      consumes:
      - application/json
      description: Soft or hard delete mixing order (Admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Delete options
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.DeleteMixedRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete mixing order
      tags:
      - admin
    get:
      consumes:
      - application/json
      description: Get detailed info about any mixing order (Admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MixedDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get mixing order by ID
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Update mixing order parameters (Admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated order data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateMixedRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update mixing order
      tags:
      - admin
  /admin/mixed/{id}/complete:
    put:
      consumes:
      - application/json
      description: Mark mixing order as completed (Admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Completion data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CompleteMixedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.CompleteMixedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Complete mixing order
      tags:
      - admin
  /admin/mixed/{id}/items:
    delete:
      consumes:
      - application/json
      description: Remove a chemical element from mixing order (Admin only)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Element to remove
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.DeleteFromMixedRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete element from order
      tags:
      - admin
  /admin/users:
    get:
      consumes:
      - application/json
      description: Get list of all users in system (Admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.UserProfileResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - admin
  /admin/users/{id}:
    get:
      consumes:
      - application/json
      description: Get user profile information by user ID (Admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - admin
  /admin/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Grant or revoke moderator role for a user (Admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUserRoleRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user role
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticate user with credentials and receive JWT token + session cookie
        JWT token is saved in Redis for revocation support
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Logout user and revoke JWT token (both from Redis and session)
        After logout, the token is no longer valid even if signature is correct
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - auth
  /auth/profile:
    get:
      consumes:
      - application/json
      description: Get profile information of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update login and/or password of current user
      parameters:
      - description: Updated user data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - users
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with login and password
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User successfully registered
          schema:
            $ref: '#/definitions/handler.UserInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: User registration
      tags:
      - auth
  /elements:
    get:
      consumes:
      - application/json
      description: Get list of all elements with optional search by name
      parameters:
      - description: Search query by element name
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ElementResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get all elements
      tags:
      - elements
    post:
      consumes:
      - application/json
      description: Create a new chemical element (Admin only)
      parameters:
      - description: Element data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateElementRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.CreateElementResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create new element
      tags:
      - elements
  /elements/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a chemical element (Admin only)
      parameters:
      - description: Element ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.DeleteElementResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete element
      tags:
      - elements
    get:
      consumes:
      - application/json
      description: Retrieve a specific element by its ID
      parameters:
      - description: Element ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ElementResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get element by ID
      tags:
      - elements
    put:
      consumes:
      - application/json
      description: Update an existing chemical element (Admin only)
      parameters:
      - description: Element ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated element data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateElementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ElementResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update element
      tags:
      - elements
  /elements/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image for a chemical element (Admin only)
      parameters:
      - description: Element ID
        in: path
        name: id
        required: true
        type: integer
      - description: Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.UploadImageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload element image
      tags:
      - elements
  /mixed/my:
    get:
      consumes:
      - application/json
      description: Get list of all mixing orders created by current user
      parameters:
      - description: Filter by status (draft, pending, completed)
        in: query
        name: status
        type: string
      - description: 'Limit results (default: 50)'
        in: query
        name: limit
        type: integer
      - description: 'Offset results (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.MixedListItem'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user's mixing orders
      tags:
      - mixed
  /mixed/my/{id}:
