  /admin/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Grant or revoke moderator role for a user (Admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role update data
        in: body
        name: request
        required: true
