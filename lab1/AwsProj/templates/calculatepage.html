<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metoda - Расчет веществ</title>
    <link rel="stylesheet" href="/static/styles/calculatepage_style.css">
    <!-- или если используете общий файл: -->
    <!-- <link rel="stylesheet" href="/static/styles/cards_style.css"> -->
</head>
<body>
    <header>
        <a href="/hello" class="home-link">
            <img src="/static/img/image.svg" alt="На главную">
        </a>

        <div class="header-result">
            <input type="text" placeholder="Результат" readonly>
        </div>
    </header>

    <main>
        <div class="cards-container">
            {{ range .orders }}
            <div class="card">
                <img src="{{ .Image }}" alt="{{ .Title }}" class="card-img">
                <h3>{{ .Title }}</h3>
                <p><strong>pH:</strong> {{ .PH }} при {{ .Concentration }} 25°C</p>
                
                <div class="mass-input">
                    <label for="mass-{{ .ID }}">Масса (г):</label>
                    <input type="number" id="mass-{{ .ID }}" class="mass-field" placeholder="0.0" step="0.1" min="0">
                </div>

                <button class="btn calculate-btn" data-id="{{ .ID }}">
                    Сформировать заявку
                </button>
            </div>
            {{ end }}
        </div>
    </main>

    <script>
        document.querySelectorAll('.calculate-btn').forEach(button => {
            button.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                const massInput = document.getElementById('mass-' + id);
                const mass = massInput.value;
                
                if (!mass || mass <= 0) {
                    alert('Пожалуйста, введите корректную массу вещества');
                    return;
                }
                
                alert(`Заявка для вещества ID: ${id} с массой: ${mass}г отправлена в обработку`);
            });
        });
    </script>
</body>
</html>
